services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentflex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentflex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dentflex}
    # Local dev only: bound to loopback. In production remove the ports entry so
    # the database is reachable only on the private compose network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentflex}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentflex}:${POSTGRES_PASSWORD:-dentflex_dev_only}@db:5432/${POSTGRES_DB:-dentflex}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]

  worker:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentflex}:${POSTGRES_PASSWORD:-dentflex_dev_only}@db:5432/${POSTGRES_DB:-dentflex}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "worker"]

volumes:
  pgdata:
